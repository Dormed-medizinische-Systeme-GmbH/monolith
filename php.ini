; Produktion. Kein Octane (ADR-034) — OPcache traegt hier die Hauptlast.
; Wird nach /usr/local/etc/php/conf.d/99-dormed.ini kopiert (siehe Dockerfile).
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Der Code aendert sich im Image nie — Dateien bei jedem Request zu pruefen
; waere reine Verschwendung. Ein Deploy startet den Container ohnehin neu.
opcache.validate_timestamps = 0

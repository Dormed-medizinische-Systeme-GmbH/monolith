; Ein Container hat genau ein CMD, nginx und php-fpm sind zwei Prozesse.
; Sobald ein Queue-Worker dazukommt, ist der saubere Schnitt eine Prod-Compose
; mit `app` + `worker` statt eines dritten Eintrags hier (ADR-041).
;
; Wird nach /etc/supervisord.conf kopiert (siehe Dockerfile).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Minimal local stack: Laravel app + PostgreSQL.
# Credentials have a single source of truth in .env (the DB_* block).
# Docker Compose reads that same .env for ${...} substitution below, so the
# values Postgres is initialised with always match what Laravel connects with.
services:
  app:
    build: ./docker/app
    # Run as the host user so files created in the bind mount (composer install,
    # artisan make:*, migrations output) stay owned by the developer, not root.
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    # The mapped uid has no passwd entry / home; give tooling (composer, psysh) a
    # writable HOME outside the bind mount.
    environment:
      HOME: /tmp
    working_dir: /var/www/html
    # First boot bootstraps the app: install deps if missing, generate an app key
    # if .env has none, run migrations, then serve. Safe to re-run on restart.
    command: >
      sh -c "{ [ -f vendor/autoload.php ] || composer install --no-interaction; } &&
             { grep -qE '^APP_KEY=.+' .env || php artisan key:generate; } &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    # No env_file here: Laravel reads .env from the bind mount itself. Injecting
    # those keys as real container env vars would shadow phpunit.xml's <env>
    # overrides (PHPUnit won't replace a variable that already exists).
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - dormed

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dormed

networks:
  dormed:
    driver: bridge

volumes:
  pgsql-data:
    driver: local

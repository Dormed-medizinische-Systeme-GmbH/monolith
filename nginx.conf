# EIN Server-Block fuer alle vier Hostnames — es ist eine Anwendung (ADR-033).
# Welcher Zugriffspunkt gemeint ist, entscheidet Laravel am Host, nicht nginx:
# Geschaeftslogik gehoert nicht in den Webserver (.ai/rules/routing.md).
#
# Wird nach /etc/nginx/nginx.conf kopiert (siehe Dockerfile).
user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / { try_files $uri $uri/ /index.php?$query_string; }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ ^/build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60;
        }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
